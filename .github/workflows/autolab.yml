name: AutoLab Cloud Runner
on:
  push:
    branches: ['feature/autolab-v0.2-supabase-analysis']
  workflow_dispatch:
    inputs:
      runs:
        description: 'Runs per strategy (1-1000)'
        required: true
        default: '10'
      strategies:
        description: 'Comma-separated strategies'
        required: true
        default: 'random,economy,attack,aoe,link,survival'
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - name: Test diagnostics pipeline
        run: python -m unittest discover -s tests -v
      - name: Run AutoLab
        env:
          RUNS: ${{ github.event.inputs.runs || '17' }}
          STRATEGIES: ${{ github.event.inputs.strategies || 'random,economy,attack,aoe,link,survival' }}
        run: |
          python - <<'PY'
          import os,subprocess
          runs=int(os.environ['RUNS'])
          if not 1<=runs<=1000:raise SystemExit('runs must be 1..1000')
          subprocess.run(['python','run_autolab.py','--runs',str(runs),'--strategies',os.environ['STRATEGIES']],check=True)
          PY
      - name: Validate real-engine logs
        run: python tests/validate_results.py results
      - name: Analyze bot runs and promotion blockers
        run: python cloud/analyze_results.py results
      - name: Upload all AutoLab logs and analysis to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python cloud/upload_results.py results/runs.csv
      - name: Publish analysis summary
        if: always()
        run: |
          if [ -f results/analysis.md ]; then cat results/analysis.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autolab-results
          path: results/
