name: v0.2.18 online validation and AutoLab
on:
  push:
    branches: ['feature/game-v0.2.18-online-audio']
  workflow_dispatch:
concurrency:
  group: v0218-validated-pages
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify and unpack original artwork and latest music
        run: python prepare_site.py
      - name: Diagnostics pipeline tests
        run: python -m unittest discover -s tests -p 'test_pipeline.py' -v
      - name: Actual mobile UI, initials, ranking, retry, endless and promotions
        run: python -m unittest discover -s tests -p 'test_v0218_browser.py' -v
      - name: AutoLab v0.2.18 - six strategies, 102 runs
        run: python run_autolab.py --runs 17 --seed 218000
      - run: python tests/validate_results.py results
      - run: python cloud/analyze_results.py results
      - name: Upload AI activity and analysis to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python cloud/upload_results.py results/runs.csv
      - name: Summary
        if: always()
        run: if [ -f results/analysis.md ]; then cat results/analysis.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0218-ui-and-autolab
          path: |
            results/
            results-ui/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested v0.2.18
        id: deployment
        uses: actions/deploy-pages@v4
